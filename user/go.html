<!DOCTYPE html>
<!-- ============================================================
     FILE   : user/go.html
     KAAM   : 100% AdLinkFly v6.5.3 go page jaisa
              - Banner page: 728x90, 468x60, 336x280 ads
              - Interstitial page: Full iframe ad
              - Countdown timer (configurable)
              - Popup ad option
              - AJAX redirect to destination
     ============================================================ -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shortify</title>
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="//fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic" rel="stylesheet">

    <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../vendor/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="../vendor/dashboard/css/AdminLTE.min.css">
    <link rel="stylesheet" href="../vendor/dashboard/css/skins/skin-blue.min.css">
    <link rel="stylesheet" href="../css/app.css">

    <style>
        .interstitial-page.frame.layout-top-nav .wrapper { padding-top: 50px; }
        .interstitial-page .navbar { position: fixed; top: 0; width: 100%; z-index: 1000; background: #3c8dbc; }
        .interstitial-page .navbar .navbar-brand { color: #fff; font-weight: 700; }
        .interstitial-page .skip-ad { color: #fff; text-align: center; }
        .interstitial-page .skip-ad .counter { font-size: 20px; font-weight: 700; }
        .interstitial-page iframe { width: 100%; border: none; }
        .banner-page .box-success { border-top: 3px solid #00a65a; }
        .banner { text-align: center; margin: 10px auto; }
        .banner-728x90 { max-width: 728px; }
        .banner-468x60 { max-width: 468px; }
        .banner-336x280 { max-width: 336px; }
        .countdown { display: block; font-size: 48px; font-weight: 700; color: #333; margin: 15px 0; }
        .countdown .timer { font-size: 60px; color: #00a65a; }
        .get-link { font-size: 18px; padding: 12px 40px; }
        .get-link.disabled { opacity: 0.5; cursor: not-allowed; }
        .myTestAd { height: 5px; width: 5px; position: absolute; top: 0; }
        .blog-item { margin: 15px 0; text-align: left; }
        .blog-item .page-header { margin-top: 0; }
    </style>
</head>

<body class="banner-page frame layout-top-nav skin-blue">

<div class="wrapper">

    <header class="main-header">
        <nav class="navbar">
            <div class="container">
                <div class="row is-table-row">
                    <div class="col-xs-6 col-sm-3">
                        <div class="navbar-header pull-left">
                            <a class="navbar-brand" href="../index.html"><b>Shortify</b></a>
                        </div>
                    </div>
                    <div class="hidden-xs col-sm-6">
                        <div class="banner banner-468x60" id="header-banner">
                            <div class="banner-inner" id="ad-header-banner"></div>
                        </div>
                    </div>
                    <div class="col-xs-6 col-sm-3">
                        <div class="pull-right">
                            <div class="skip-ad">
                                <div class="text-center">
                                    <span>Please Wait</span><br>
                                    <span class="counter" id="header-counter"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="myTestAd" id="ad-banner"></div>

    <!-- ======== MAIN CONTENT (BANNER PAGE) ======== -->
    <div class="row" id="banner-page">
        <div class="col-md-10 col-md-offset-1">
            <div class="box box-success">
                <div class="box-body text-center">

                    <!-- 728x90 Banner -->
                    <div class="banner banner-728x90" id="top-banner">
                        <div class="banner-inner" id="ad-top-banner"></div>
                    </div>

                    <!-- Blog Post (optional) -->
                    <div class="blog-item text-left" id="blog-section" style="display:none">
                        <div class="page-header">
                            <h3><small><a href="#">From Our Blog:</a></small> <span id="blog-title"></span></h3>
                        </div>
                        <div class="blog-content" id="blog-content"></div>
                    </div>

                    <h4>Your link is almost ready.</h4>

                    <!-- Countdown Timer -->
                    <span id="countdown" class="countdown">
                        <span id="timer" class="timer">5</span><br>Seconds
                    </span>

                    <!-- 468x60 Banner -->
                    <div class="banner banner-468x60" id="mid-banner">
                        <div class="banner-inner" id="ad-mid-banner"></div>
                    </div>

                    <!-- Get Link Button -->
                    <div style="margin-bottom: 10px;">
                        <a href="javascript: void(0)" class="btn btn-success btn-lg get-link disabled" id="get-link-btn">
                            Please wait...
                        </a>
                    </div>

                    <!-- 336x280 Banner -->
                    <div class="banner banner-336x280" id="bottom-banner">
                        <div class="banner-inner" id="ad-bottom-banner"></div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- ======== INTERSTITIAL PAGE (hidden by default) ======== -->
    <div id="interstitial-page" style="display:none">
        <iframe id="interstitial-frame" src="about:blank"></iframe>
    </div>

</div>

<!-- ======== HIDDEN FORMS ======== -->
<form id="go-link" class="hidden" method="POST">
    <input type="hidden" name="ad_form_data" id="ad_form_data" value="">
</form>

<form id="go-popup" class="hidden" method="POST" target="_blank">
    <input type="hidden" name="pop_ad" id="pop_ad_data" value="">
</form>

<script src="../vendor/jquery.min.js"></script>
<script src="../vendor/bootstrap/js/bootstrap.min.js"></script>
<script src="../vendor/clipboard.min.js"></script>
<script src="../vendor/dashboard/js/app.min.js"></script>

<script type="module">
    import { db } from "./js/firebase-config.js";
    import { SITE_URL } from "./js/app.js";
    import { ref, get, runTransaction }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    /* ============================================================
       1. ALIAS / PASS MODE READ
       ============================================================ */
    var mode = "alias", alias = "", targetUrl = "", ownerUid = null, adType = "interstitial";
    var hash = location.hash;

    if (hash.startsWith("#?")) {
        var p = new URLSearchParams(hash.substring(2));
        try { targetUrl = p.get("u") || ""; } catch(e) { targetUrl = ""; }
        ownerUid = p.get("o") || null;
        adType = ["interstitial","banner","none"].indexOf(p.get("t")) >= 0 ? p.get("t") : "interstitial";
        var okUrl = false;
        try { okUrl = !!new URL(targetUrl); } catch(e) {}
        if (!okUrl) { document.body.innerHTML = '<div class="container text-center" style="margin-top:50px"><h3>Invalid link!</h3><p>Valid destination nahi hai.</p></div>'; return; }
        mode = "pass";
    } else {
        alias = hash.replace("#", "").trim() || new URLSearchParams(location.search).get("u") || "";
        if (!alias) { document.body.innerHTML = '<div class="container text-center" style="margin-top:50px"><h3>No link!</h3><p>Short link missing hai.</p></div>'; return; }
    }

    /* ============================================================
       2. LOAD GO_PAGE SETTINGS
       ============================================================ */
    let GP = {};
    try {
        const gpSnap = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
            .then(m => m.get(ref(db, "settings/go_page")));
        GP = gpSnap.val() || {};
    } catch(e) {}

    const COUNTER_VALUE = parseInt(GP.step_seconds) || parseInt(GO_PAGE && GO_PAGE.counter_value) || 5;
    const ENABLE_POPUP = GP.enable_popup !== false;
    const INTERSTITIAL_AD_URL = GP.interstitial_ad_url || "";
    const POPUNDER_CODE = GP.popunder_code || "";

    /* ============================================================
       3. DETERMINE AD TYPE & RENDER
       ============================================================ */
    let linkData = null;
    let displayTimer = COUNTER_VALUE;

    if (mode === "pass") {
        adType = adType;
    } else {
        try {
            const linkSnap = await get(ref(db, "aliases/" + alias));
            if (linkSnap.exists()) {
                linkData = linkSnap.val();
                targetUrl = linkData.url;
                ownerUid = linkData.uid;
                adType = linkData.ad_type || "interstitial";
            } else {
                document.body.innerHTML = '<div class="container text-center" style="margin-top:50px"><h3>Link not found!</h3><p>Ye link exist nahi karta.</p></div>';
                return;
            }
        } catch(e) {
            document.body.innerHTML = '<div class="container text-center" style="margin-top:50px"><h3>Error!</h3><p>Link load nahi ho raha.</p></div>';
            return;
        }
    }

    /* ============================================================
       4. RENDER PAGE BASED ON AD TYPE
       ============================================================ */
    function renderBannerPage() {
        document.getElementById("banner-page").style.display = "";
        document.getElementById("interstitial-page").style.display = "none";
        document.body.className = "banner-page frame layout-top-nav skin-blue";

        // Banner ads inject karo
        const gp = GP;
        if (gp.top_banner_code) {
            injectAd("ad-top-banner", gp.top_banner_code);
        }
        if (gp.mid_banner_code) {
            injectAd("ad-mid-banner", gp.mid_banner_code);
        }
        if (gp.bottom_banner_code) {
            injectAd("ad-bottom-banner", gp.bottom_banner_code);
        }
        if (gp.header_banner_code) {
            injectAd("ad-header-banner", gp.header_banner_code);
        }
    }

    function renderInterstitialPage() {
        document.getElementById("banner-page").style.display = "none";
        document.getElementById("interstitial-page").style.display = "";
        document.body.className = "interstitial-page frame layout-top-nav skin-blue";

        const gp = GP;
        const iframe = document.getElementById("interstitial-frame");
        if (gp.interstitial_ad_url) {
            iframe.src = gp.interstitial_ad_url;
        }
    }

    /* ============================================================
       5. AD INJECTION HELPER
       ============================================================ */
    function injectAd(elId, code) {
        const el = document.getElementById(elId);
        if (!el || !code) return;

        const tmp = document.createElement("div");
        tmp.innerHTML = code;
        const scripts = [];
        tmp.querySelectorAll("script").forEach(s => scripts.push(s));

        const staticHtml = tmp.innerHTML.replace(/<script[\s\S]*?<\/script>/gi, "");
        el.innerHTML = staticHtml;

        scripts.forEach(old => {
            const s = document.createElement("script");
            if (old.src) { s.src = old.src; s.async = true; }
            else { s.textContent = old.textContent; }
            el.appendChild(s);
        });
    }

    /* ============================================================
       6. POPUNDER / POPUP AD
       ============================================================ */
    if (ENABLE_POPUP && POPUNDER_CODE) {
        injectAd("popunder-slot", POPUNDER_CODE);
    }

    // Popup on first click
    const goPopup = document.getElementById("go-popup");
    if (goPopup && ENABLE_POPUP) {
        document.addEventListener("click", function handler(e) {
            if (goPopup.querySelector('input[name="pop_ad"]').value) {
                var w = window.open("about:blank", "Popup_Window",
                    "toolbar=0,scrollbars=0,location=0,statusbar=0,menubar=0,resizable=0," +
                    "width=" + (screen.width - 150) + ",height=" + (screen.height - 150));
                goPopup.target = "Popup_Window";
                goPopup.submit();
            }
            document.removeEventListener("click", handler);
        });
    }

    /* ============================================================
       7. RENDER PAGE
       ============================================================ */
    if (adType === "banner") {
        renderBannerPage();
    } else {
        renderInterstitialPage();
    }

    /* ============================================================
       8. COUNTDOWN TIMER (AdLinkFly style)
       ============================================================ */
    var time = displayTimer * 1000;
    var delta = 1000;
    var blurred = false;

    window.onblur = function() { blurred = true; };
    window.onfocus = function() { blurred = false; };

    var timerEl = document.getElementById("timer");
    var getLinkBtn = document.getElementById("get-link-btn");

    var tid = setInterval(function() {
        if (blurred) return;
        time -= delta;
        var secs = Math.ceil(time / 1000);

        if (timerEl) timerEl.textContent = secs;
        if (document.getElementById("header-counter")) {
            document.getElementById("header-counter").textContent = secs + " s";
        }

        if (time <= 0) {
            clearInterval(tid);

            if (adType === "banner") {
                // Get Link button enable karo
                if (getLinkBtn) {
                    getLinkBtn.classList.remove("disabled");
                    getLinkBtn.textContent = "Get Link";
                    getLinkBtn.href = "#";
                    getLinkBtn.onclick = function(e) {
                        e.preventDefault();
                        window.location.href = targetUrl;
                    };
                }
            } else {
                // Interstitial: skip ad link dikhao
                const skipAd = document.querySelector(".skip-ad");
                if (skipAd) {
                    skipAd.innerHTML = '<a href="' + targetUrl + '" class="btn" style="color:#fff;font-weight:700">Get Link</a>';
                }
            }
        }
    }, delta);

    /* ============================================================
       9. CLICK COUNT (background)
       ============================================================ */
    if (mode === "alias" && alias) {
        try {
            runTransaction(ref(db, "aliases/" + alias + "/clicks"), function(c) {
                return (c || 0) + 1;
            });
        } catch(e) {}
    }

</script>

</body>
</html>
