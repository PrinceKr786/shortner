<!DOCTYPE html>
<!-- ============================================================
     FILE   : user/signup.html
     KAAM   : REGISTRATION PAGE - AdLinkFly ke Auth/Users/
              signup.ctp jaisa (AdminLTE register-box).
              REFERRAL SUPPORT: agar link me ?ref=CODE hai to
              code capture hota hai (signin.html se aane wale
              traffic ke liye bhi kaam karta hai).
     FLOW   : Account banne pe:
                1. users/{uid} profile save
                2. refcodes/{code} = uid map
                3. stats/total_users increment
                4. referrer ki team me entry (referrals node)
     ============================================================ -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Shortify</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="//fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic" rel="stylesheet">

    <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../vendor/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="../vendor/dashboard/css/AdminLTE.min.css">
    <!-- Inline skin-blue CSS (GitHub Pages fix) -->
    <style>
        .skin-blue .main-header .navbar{background-color:#3c8dbc}
        .skin-blue .main-header .navbar .nav>li>a{color:#fff}
        .skin-blue .main-header .navbar .nav>li>a:hover,.skin-blue .main-header .navbar .nav>li>a:active,.skin-blue .main-header .navbar .nav>li>a:focus,.skin-blue .main-header .navbar .nav .open>a,.skin-blue .main-header .navbar .nav .open>a:hover,.skin-blue .main-header .navbar .nav .open>a:focus,.skin-blue .main-header .navbar .nav>.active>a{background:rgba(0,0,0,0.1);color:#f6f6f6}
        .skin-blue .main-header .navbar .nav>.active>a{border-bottom-color:#3c8dbc}
        .skin-blue .main-header .logo{background-color:#367fa9;color:#fff}
        .skin-blue .main-header .logo:hover{background-color:#357ca5}
        .skin-blue .main-sidebar{background-color:#222d32}
        .skin-blue .main-sidebar .sidebar>.sidebar-menu>li.active>a{border-left-color:#3c8dbc;background:#1a252f}
        .skin-blue .main-sidebar .sidebar>.sidebar-menu>li>a:hover{background:#1a252f}
        .skin-blue .main-sidebar .sidebar>.sidebar-menu>li>.treeview-menu>li.active>a,.skin-blue .main-sidebar .sidebar>.sidebar-menu>li>.treeview-menu>li>a:hover{background:#1a252f;color:#fff}
        .skin-blue .main-sidebar .sidebar>.sidebar-menu>.treeview.active>a,.skin-blue .main-sidebar .sidebar>.treeview>li>a:hover{color:#fff}
        .skin-blue .main-sidebar .sidebar .sidebar-menu>li>a{color:#b8c7ce}
        .skin-blue .main-sidebar .sidebar .sidebar-menu>li>.treeview-menu>li>a{color:#8091a0}
        .skin-blue .main-sidebar .sidebar .user-panel>.info,.skin-blue .main-sidebar .sidebar .user-panel>.info>a{color:#fff}
        .skin-blue .wrapper,.skin-blue .main-footer{background-color:#ecf0f5}
        .skin-blue .sidebar .shorten-button{background:#3c8dbc;border-color:#367fa9;color:#fff}
        .skin-blue .sidebar .shorten-button:hover{background:#367fa9;border-color:#2e6da4}
        .btn-social{position:relative;padding-left:44px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .btn-social>:first-child{position:absolute;left:0;top:0;bottom:0;width:42px;line-height:24px;font-size:1.6em;text-align:center;border-right:1px solid rgba(255,255,255,.15)}
        .btn-github{color:#fff;background-color:#444;border-color:rgba(0,0,0,.2)}
        .btn-github:hover,.btn-github:focus{color:#fff;background-color:#333;border-color:rgba(0,0,0,.2)}
    </style>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="icon" href="../favicon.ico">
</head>

<body class="hold-transition register-page">

<div class="register-box">
    <div class="register-logo">
        <a href="../index.html"><b>Shortify</b></a>
    </div>

    <div class="register-box-body">
        <p class="login-box-msg">Naya member account banao</p>

        <form id="signup-form">
            <div class="form-group has-feedback">
                <input type="text" class="form-control" id="name-input"
                       placeholder="Full name" required autocomplete="name">
                <span class="fa fa-user form-control-feedback"></span>
            </div>
            <div class="form-group has-feedback">
                <input type="email" class="form-control" id="email-input"
                       placeholder="Email address" required autocomplete="email">
                <span class="fa fa-envelope form-control-feedback"></span>
            </div>
            <div class="form-group has-feedback">
                <input type="password" class="form-control" id="password-input"
                       placeholder="Password (min 6 characters)" required minlength="6"
                       autocomplete="new-password">
                <span class="fa fa-lock form-control-feedback"></span>
            </div>
            <div class="form-group has-feedback">
                <input type="password" class="form-control" id="confirm-input"
                       placeholder="Retype password" required minlength="6"
                       autocomplete="new-password">
                <span class="fa fa-lock form-control-feedback"></span>
            </div>

            <!-- reCAPTCHA (admin key dale to dikhega) -->
            <div id="captcha-slot" class="form-group hidden">
                <div id="captcha-box"></div>
            </div>

            <!-- Terms checkbox -->
            <div class="row" style="margin-bottom:12px">
                <div class="col-xs-12">
                    <label>
                        <input type="checkbox" id="terms-check" required>
                        Main <a href="#" target="_blank">terms</a>
                        accept karta hoon
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-flat"
                    id="signup-btn">Register</button>
        </form>

        <!-- Error / Success boxes -->
        <div class="alert alert-danger hidden" id="error-box" style="margin-top:12px"></div>

        <!-- ======== SOCIAL REGISTER (settings se on/off) ======== -->
        <div class="social-auth-links text-center hidden" id="social-box" style="margin-top:10px">
            <p>- OR -</p>
            <a href="#" class="btn btn-block btn-social btn-flat"
               id="google-btn" style="background:#fff;color:#dd4b39;border:1px solid #ddd">
                <i class="fa fa-google-plus"></i> Register using Google
            </a>
            <a href="#" class="btn btn-block btn-social btn-facebook btn-flat"
               id="facebook-btn">
                <i class="fa fa-facebook"></i> Register using Facebook
            </a>
        </div>

        <br>
        <a href="signin.html" class="text-center">Mere paas account already hai</a>

    </div>
    <!-- /.register-box-body -->
</div>
<!-- /.register-box -->


<script type="module">
    import { auth } from "./js/firebase-config.js";
    import { db } from "./js/firebase-config.js";
    import {
        createUserWithEmailAndPassword, updateProfile,
        GoogleAuthProvider, FacebookAuthProvider, signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
        ref, set, get, runTransaction, child
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const errBox = document.getElementById("error-box");

    /* ============================================================
       SETTINGS LOAD - signup on/off + captcha key + social toggles
       ============================================================ */
    let CAPTCHA_KEY = "";
    let captchaOk = false;   // captcha verify hua ya nahi

    try {
        const sSnap = await get(child(ref(db), "settings"));
        const s = sSnap.val() || {};

        // SIGNUP BAND HAI? -> form block karo
        if (s.signup_enabled === "off") {
            document.getElementById("signup-form").innerHTML =
                `<div class="alert alert-warning text-center">
                    <i class="fa fa-lock"></i><br>
                    Naye registrations abhi band hain.<br>
                    Thodi der baad try karo.</div>`;
            throw new Error("signup-off");   // baaki init skip
        }

        // reCAPTCHA key? -> widget render karo
        CAPTCHA_KEY = s.recaptcha_site_key || "";

        if (s.google_login === "on" || s.facebook_login === "on") {
            document.getElementById("social-box")
                .classList.remove("hidden");
        }

        if (CAPTCHA_KEY) {
            window.___grcb = () => {
                try {
                    window.grecaptcha.render("captcha-box", {
                        sitekey: CAPTCHA_KEY,
                        callback: () => { captchaOk = true; },
                        "expired-callback": () => { captchaOk = false; }
                    });
                    document.getElementById("captcha-slot")
                        .classList.remove("hidden");
                } catch (e) { console.error(e); }
            };
            const sc = document.createElement("script");
            sc.src = "https://www.google.com/recaptcha/api.js" +
                     "?onload=___grcb&render=explicit";
            document.head.appendChild(sc);
        }
    } catch (e) {
        if (e.message !== "signup-off") console.error(e);
    }

    function friendlyError(code) {
        const map = {
            "auth/email-already-in-use": "Ye email pehle se registered hai.",
            "auth/invalid-email": "Email format galat hai.",
            "auth/weak-password": "Password kamzor hai - 6+ characters rakho."
        };
        return map[code] || null;
    }

/* ---------- Signup Submit ---------- */
    document.getElementById("signup-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        // Captcha required?
        if (CAPTCHA_KEY && !captchaOk) {
            errBox.textContent = "Please complete the captcha first.";
            errBox.classList.remove("hidden");
            return;
        }

        const name = document.getElementById("name-input").value.trim();
        const email = document.getElementById("email-input").value.trim();
        const pass  = document.getElementById("password-input").value;
        const pass2 = document.getElementById("confirm-input").value;

        if (pass !== pass2) {
            errBox.textContent = "Dono passwords match nahi kar rahe!";
            errBox.classList.remove("hidden");
            return;
        }

        const btn = document.getElementById("signup-btn");
        btn.disabled = true;
        btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Creating...';

        try {
            // Step 1: Auth account create
            const credential = await createUserWithEmailAndPassword(auth, email, pass);
            const uid = credential.user.uid;

            // Step 2: Display name set
            await updateProfile(credential.user, { displayName: name });

            // Step 3: Profile save
            // REFERRAL: ?ref=CODE capture (jo bhi page se aaya ho)
            const refParam = new URLSearchParams(location.search).get("ref");
            const cleanName = name.replace(/[^a-zA-Z]/g, "").toUpperCase()
                                  .substring(0, 6).padEnd(4, "X");
            const myRefCode = cleanName + Math.floor(Math.random() * 9000 + 1000);

            await set(ref(db, `users/${uid}`), {
                name: name,
                email: email,
                role: "user",
                disabled: false,
                wallet_money: 0,
                total_withdrawn: 0,
                referral_earnings: 0,
                referral_code: myRefCode,
                referred_by: refParam || null,
                created_at: Date.now(),
                stats: { total_clicks: 0, total_links: 0 }
            });

            // Step 4: refcodes map (go.html commission lookup isse karta hai)
            await set(ref(db, `refcodes/${myRefCode}`), uid);

            // Step 5: Public user counter
            runTransaction(ref(db, "stats/total_users"),
                (cur) => (cur || 0) + 1);

            // Step 6: Referrer ko team member add karo
            if (refParam) {
                try {
                    const codeSnap = await get(ref(db, `refcodes/${refParam}`));
                    const referrerUid = codeSnap.val();
                    if (referrerUid && referrerUid !== uid) {
                        await set(
                            ref(db, `referrals/${referrerUid}/${uid}`),
                            { name: name, joined_at: Date.now() });
                    }
                } catch { /* optional */ }
            }

            window.location.href = "dashboard.html";

        } catch (err) {
            errBox.textContent =
                friendlyError(err.code) || ("Signup fail: " + err.message);
            errBox.classList.remove("hidden");
            btn.disabled = false;
            btn.innerHTML = "Register";
        }
    });

    /* ---------- SOCIAL SIGN UP ---------- */
    async function socialSignUp(provider) {
        errBox.classList.add("hidden");
        if (CAPTCHA_KEY && !captchaOk) {
            errBox.textContent = "Please complete the captcha first.";
            errBox.classList.remove("hidden");
            return;
        }
        try {
            const cred = await signInWithPopup(auth, provider);
            const u = cred.user;

            // Profile exists?
            const snap = await get(ref(db, `users/${u.uid}`));
            if (!snap.exists()) {
                // First time social user -> create profile
                const cleanName = (u.displayName || "User").replace(/[^a-zA-Z]/g, "").toUpperCase()
                                  .substring(0, 6).padEnd(4, "X");
                const myRefCode = cleanName + Math.floor(Math.random() * 9000 + 1000);
                const refParam = new URLSearchParams(location.search).get("ref");

                await set(ref(db, `users/${u.uid}`), {
                    name: u.displayName || "User",
                    email: u.email,
                    role: "user",
                    disabled: false,
                    wallet_money: 0,
                    total_withdrawn: 0,
                    referral_earnings: 0,
                    referral_code: myRefCode,
                    referred_by: refParam || null,
                    created_at: Date.now(),
                    stats: { total_clicks: 0, total_links: 0 }
                });
                await set(ref(db, `refcodes/${myRefCode}`), u.uid);
                runTransaction(ref(db, "stats/total_users"), (cur) => (cur || 0) + 1);

                if (refParam) {
                    try {
                        const codeSnap = await get(ref(db, `refcodes/${refParam}`));
                        const referrerUid = codeSnap.val();
                        if (referrerUid && referrerUid !== u.uid) {
                            await set(ref(db, `referrals/${referrerUid}/${u.uid}`),
                                { name: u.displayName || "User", joined_at: Date.now() });
                        }
                    } catch {}
                }
            }
            window.location.href = "dashboard.html";

        } catch (err) {
            console.error(err);
            errBox.textContent = err.code === "auth/popup-closed-by-user"
                ? "Popup band kar diya - dobara try karo."
                : ("Social signup fail: " + err.message);
            errBox.classList.remove("hidden");
        }
    }

    document.getElementById("google-btn").addEventListener("click", (e) => {
        e.preventDefault();
        socialSignUp(new GoogleAuthProvider());
    });
    document.getElementById("facebook-btn").addEventListener("click", (e) => {
        e.preventDefault();
        socialSignUp(new FacebookAuthProvider());
    });

    function friendlyError(code) {
        const map = {
            "auth/email-already-in-use": "Ye email pehle se registered hai.",
            "auth/invalid-email": "Email format galat hai.",
            "auth/weak-password": "Password kamzor hai - 6+ characters rakho."
        };
        return map[code] || null;
    }
</script>

</body>
</html>
