<!DOCTYPE html>
<!-- ============================================================
     FILE   : user/forgot-password.html
     KAAM   : PASSWORD RESET - AdLinkFly ke Auth/Users/
              forgot_password.ctp jaisa (AdminLTE login-box).
              Firebase reset email bhejta hai.
     ============================================================ -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Shortify</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="//fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic" rel="stylesheet">

    <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../vendor/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="../vendor/dashboard/css/AdminLTE.min.css">
    <link rel="stylesheet" href="../vendor/dashboard/css/skins/_all-skins.min.css">
    <link rel="stylesheet" href="../theme/css/app.css">
    <link rel="icon" href="../favicon.ico">
</head>

<body class="hold-transition login-page">

<div class="login-box">
    <div class="login-logo">
        <a href="../index.html"><b>Shortify</b></a>
    </div>

    <div class="login-box-body">
        <p class="login-box-msg">
            Apna email dalo - reset link bhej denge
        </p>

        <form id="forgot-form">
            <div class="form-group has-feedback">
                <input type="email" class="form-control" id="email-input"
                       placeholder="Email address" required>
                <span class="fa fa-envelope form-control-feedback"></span>
            </div>

            <button type="submit"
                    class="btn btn-primary btn-block btn-flat"
                    id="reset-btn">Reset Link Bhejo</button>
        </form>

        <div class="alert alert-danger hidden" id="error-box" style="margin-top:12px"></div>
        <div class="alert alert-success hidden" id="success-box" style="margin-top:12px"></div>

        <br>
        <a href="signin.html"><i class="fa fa-sign-in"></i> Sign In pe wapas jao</a><br>
        <a href="signup.html" class="text-center">Register a new membership</a>

    </div>
</div>


<script type="module">
    import { auth } from "./js/firebase-config.js";
    import { sendPasswordResetEmail }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const errBox = document.getElementById("error-box");
    const okBox  = document.getElementById("success-box");

    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email-input").value.trim();
        const btn = document.getElementById("reset-btn");
        btn.disabled = true;
        btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Sending...';

        try {
            await sendPasswordResetEmail(auth, email);
            errBox.classList.add("hidden");
            okBox.textContent =
                "Email chala gaya! Inbox (aur spam folder) check karo.";
            okBox.classList.remove("hidden");
            btn.innerHTML = "Email Bhej Diya \u2713";

        } catch (err) {
            okBox.classList.add("hidden");
            errBox.textContent = "Fail: " + err.message;
            errBox.classList.remove("hidden");
            btn.disabled = false;
            btn.innerHTML = "Reset Link Bhejo";
        }
    });
</script>

</body>
</html>
